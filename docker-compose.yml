name: tnas-controller

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tnas_controller
      POSTGRES_USER: tnas_controller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnas_controller -d tnas_controller"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tnas_controller:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/tnas_controller
      REDIS_URL: redis://redis:6379/0
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?Copy .env.example to .env and set BASIC_AUTH_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/.venv/bin/python"]
    command: ["-m", "worker.runtime"]
    environment:
      DATABASE_URL: postgresql+asyncpg://tnas_controller:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/tnas_controller
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: ${WORKER_ID:-publish-worker-1}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      DRAMATIQ_WORKER_THREADS: ${DRAMATIQ_WORKER_THREADS:-2}
      PUBLISH_EXECUTOR_MODE: ${PUBLISH_EXECUTOR_MODE:-fake}
      TRUENAS_VERSION: ${TRUENAS_VERSION:-25.10}
      TRUENAS_WS_URL: ${TRUENAS_WS_URL:-}
      TRUENAS_API_KEY: ${TRUENAS_API_KEY:-}
      TRUENAS_TLS_VERIFY: ${TRUENAS_TLS_VERIFY:-true}
      TRUENAS_TLS_CA_FILE: ${TRUENAS_TLS_CA_FILE:-}
      TRUENAS_APPLY_ENABLED: ${TRUENAS_APPLY_ENABLED:-false}
      DATASET_CLEANUP_ENABLED: ${DATASET_CLEANUP_ENABLED:-false}
      DATASET_CLEANUP_INTERVAL_SECONDS: ${DATASET_CLEANUP_INTERVAL_SECONDS:-604800}
      DATASET_CLEANUP_RETENTION_DAYS: ${DATASET_CLEANUP_RETENTION_DAYS:-30}
      DATASET_CLEANUP_BATCH_SIZE: ${DATASET_CLEANUP_BATCH_SIZE:-10}
      TRUENAS_CLEANUP_APPLY_ENABLED: ${TRUENAS_CLEANUP_APPLY_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
