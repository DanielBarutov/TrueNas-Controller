[project]
name = "truenas-controller"
version = "0.1.0"
description = "Safe game update controller for TrueNAS-backed stations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "dramatiq[redis]>=1.17,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx2>=2,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "application", "domain", "presentation", "repository", "worker", "agent", "truenas_adapter", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "application",
    "domain",
    "presentation",
    "repository",
    "worker",
    "agent",
    "truenas_adapter",
]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
