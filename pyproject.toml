[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "application", "domain", "presentation", "repository", "worker", "agent", "truenas_adapter", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "application",
    "domain",
    "presentation",
    "repository",
    "worker",
    "agent",
    "truenas_adapter",
]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
